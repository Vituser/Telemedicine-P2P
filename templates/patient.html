<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабинет Пациента | Телемед</title>
  <style>
    :root { --primary: #059669; --bg: #f8fafc; --card: #ffffff; --text: #0f172a; --border: #e2e8f0; --success: #10b981; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 16px; max-width: 1100px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .badge { background: #d1fae5; color: #065f46; padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .join-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .input-code { font-family: monospace; font-size: 18px; text-transform: uppercase; padding: 10px; border: 1px solid var(--border); border-radius: 8px; width: 130px; text-align: center; font-weight: 700; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn:disabled { opacity: 0.5; }
    .video-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 768px) { .video-grid { grid-template-columns: 1fr; } }
    .video-box { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 4/3; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .label { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.6); color: #fff; padding: 4px 8px; border-radius: 6px; font-size: 12px; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; margin-right: 6px; }
    .status-dot.active { background: var(--success); }
    .ai-badge { font-size: 12px; color: var(--primary); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>

  <header>
    <h2>👤 Приём Врача</h2>
    <span class="badge">Пациент</span>
  </header>

  <div class="card join-bar">
    <input type="text" id="inputCode" class="input-code" placeholder="КОД" maxlength="6">
    <button class="btn" id="btnJoin" onclick="joinSession()">Войти</button>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 12px;">
      <span class="ai-badge" id="aiStatus" style="display:none;">📷 Анализ лица: 1 кадр/с</span>
      <div>
        <span class="status-dot" id="dot"></span>
        <span id="status">Введите код от врача</span>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="video-grid">
      <div class="video-box">
        <video id="localVideo" autoplay playsinline muted></video>
        <div class="label">Вы (Пациент)</div>
      </div>
      <div class="video-box">
        <video id="remoteVideo" autoplay playsinline></video>
        <div class="label">Врач</div>
      </div>
    </div>
  </div>

  <!-- Невидимый холст для съемки кадров -->
  <canvas id="captureCanvas" style="display:none;"></canvas>

  <script>
    let room = null, token = null, pc = null, localStream = null, eventIndex = 0;
    const iceQueue = [];
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function setStatus(text, active=false) {
      document.getElementById('status').innerText = text;
      document.getElementById('dot').className = 'status-dot' + (active ? ' active' : '');
    }

    async function joinSession() {
      const input = document.getElementById('inputCode');
      room = input.value.trim().toUpperCase();
      if (!room) return alert('Введите код комнаты!');

      document.getElementById('btnJoin').disabled = true;
      setStatus('Включение камеры...');

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('localVideo').srcObject = localStream;
      } catch (e) {
        alert('Ошибка доступа к камере: ' + e.message);
        document.getElementById('btnJoin').disabled = false;
        return;
      }

      setStatus('Подключение...');
      const res = await fetch(`/rooms/${room}/join`, { method: 'POST' });
      if (!res.ok) {
        alert('Комната не найдена или занята!');
        document.getElementById('btnJoin').disabled = false;
        return;
      }

      const data = await res.json();
      token = data.token;
      setStatus('Соединение с врачом...');

      setupWebRTC();
      setInterval(pollEvents, 1000);

      // Запуск захвата и отправки кадров (1 кадр/с)
      document.getElementById('aiStatus').style.display = 'inline-flex';
      setInterval(sendFrameForAnalysis, 1000);
    }

    function setupWebRTC() {
      pc = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

      pc.ontrack = (event) => {
        document.getElementById('remoteVideo').srcObject = event.streams[0];
        setStatus('Связь установлена (P2P)', true);
      };

      pc.onicecandidate = (event) => {
        if (event.candidate) sendSignal({ type: 'ice', candidate: event.candidate });
      };
    }

    async function sendSignal(payload) {
      await fetch(`/rooms/${room}/events`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify(payload)
      });
    }

    async function pollEvents() {
      if (!token) return;
      const res = await fetch(`/rooms/${room}/events?after=${eventIndex}`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await res.json();
      eventIndex = data.next_index;

      for (const ev of data.events) {
        if (ev.type === 'offer') {
          await pc.setRemoteDescription(new RTCSessionDescription(ev.sdp));
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendSignal({ type: 'answer', sdp: answer });

          while (iceQueue.length) await pc.addIceCandidate(iceQueue.shift());
        } else if (ev.type === 'ice') {
          if (!pc.remoteDescription) iceQueue.push(new RTCIceCandidate(ev.candidate));
          else await pc.addIceCandidate(new RTCIceCandidate(ev.candidate));
        }
      }
    }

    // Захват кадра и отправка на сервер
    function sendFrameForAnalysis() {
      if (!token) return;
      const video = document.getElementById('localVideo');
      const canvas = document.getElementById('captureCanvas');
      if (video.videoWidth === 0) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        if (!blob) return;
        await fetch(`/rooms/${room}/frames`, {
          method: 'POST',
          headers: {
            'Content-Type': 'image/jpeg',
            'Authorization': `Bearer ${token}`
          },
          body: blob
        });
      }, 'image/jpeg', 0.6);
    }
  </script>
</body>
</html>
